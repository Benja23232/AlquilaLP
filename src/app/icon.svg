<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo transparente -->
  <rect width="200" height="200" fill="transparent"/>

  <!-- Casa de contorno -->
  <g fill="none" stroke="#38BDF8" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- Techo -->
    <polyline points="35,75 100,20 165,75"/>
    <!-- Cuerpo de la casa -->
    <rect x="50" y="75" width="100" height="65"/>
    <!-- Puerta -->
    <rect x="85" y="100" width="30" height="40"/>
  </g>

  <!-- Texto ALP -->
  <text x="100" y="185" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#38BDF8" text-anchor="middle" letter-spacing="2">ALP</text>
</svg>
